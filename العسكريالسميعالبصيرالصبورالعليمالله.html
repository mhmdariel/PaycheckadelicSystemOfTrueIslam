<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منظومة الموسيقى العالمية | Global Music Engine</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#080b10;color:#e9f4ee;
font:16px system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:22px}
h1{color:#9cf5b1;font-size:clamp(24px,5vw,38px)}
p{line-height:1.8}
.panel{border:1px solid #294b3a;border-radius:16px;
padding:18px;margin:16px 0;background:#101820}
label{display:block;margin:15px 0 6px}
input,select,button{font:inherit;padding:11px;
border-radius:9px;border:1px solid #496252;
background:#17231d;color:#fff;width:100%}
button{cursor:pointer;margin-top:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{background:#174a2b}
small{color:#b4c9bd}
#status{color:#a9f5bc;min-height:28px}
</style>
</head>
<body>
<main>
<h1 id="title">منظومة الموسيقى العالمية</h1>
<p id="intro">مولّد الصوت الإيقاعي والنغمات النبضية والموسيقى
السينمائية العسكرية والتجريبية.</p>

<section class="panel">
<label id="langLabel">لغة الواجهة</label>
<select id="lang">
<option value="ar">العربية</option>
<option value="bn">বাংলা — Bangla</option>
<option value="zh">繁體中文 — Traditional Chinese</option>
<option value="en">English</option>
<option value="he">עברית — Hebrew</option>
<option value="syr">ܠܫܢܐ ܣܘܪܝܝܐ — Syriac</option>
<option value="yo">Yorùbá</option>
<option value="es">Español</option>
<option value="wo">Wolof — Sénégal</option>
<option value="af">Afrikaans</option>
<option value="ja">日本語</option>
<option value="fr">Français</option>
<option value="pt">Português</option>
<option value="ru">Русский</option>
<option value="uk">Українська</option>
<option value="light">Light Language — experimental</option>
</select>
</section>

<section class="panel">
<label id="modeLabel">نمط التوليد</label>
<select id="mode">
<option value="iso">النغمات النبضية Isochronic</option>
<option value="psy">الموسيقى السايكدلية التجريبية</option>
<option value="mil">الإيقاع العسكري السينمائي</option>
<option value="hybrid">المزيج الشامل</option>
</select>

<label id="carrierLabel">التردد الأساسي: <span id="carrierV">220</span> Hz</label>
<input id="carrier" type="range" min="20" max="2000" value="220">

<label id="pulseLabel">معدل النبض: <span id="pulseV">8</span> Hz</label>
<input id="pulse" type="range" min="0.5" max="40" step="0.5" value="8">

<label id="bpmLabel">الإيقاع الموسيقي: <span id="bpmV">120</span> BPM</label>
<input id="bpm" type="range" min="40" max="200" value="120">

<label id="depthLabel">عمق النبض: <span id="depthV">70</span>%</label>
<input id="depth" type="range" min="0" max="100" value="70">

<label id="volumeLabel">مستوى الصوت</label>
<input id="volume" type="range" min="0" max="30" value="12">

<label id="specLabel">مواصفات إضافية باللغة العربية أو أي لغة مدعومة</label>
<textarea id="spec" rows="4" style="width:100%;background:#17231d;
color:white;border-radius:9px;padding:12px"
placeholder="مثال: طبول احتفالية، موجات صوتية متحركة، أصوات عميقة وإيقاع سينمائي."></textarea>

<div class="actions">
<button class="primary" id="start">▶ تشغيل الصوت</button>
<button id="stop">■ إيقاف الصوت</button>
</div>
<div class="actions">
<button id="export">تصدير المواصفات JSON</button>
<button id="record">● بدء تسجيل WAV</button>
</div>
<p id="status" role="status" aria-live="polite">جاهز</p>
<small id="notice">يبدأ الصوت بعد تفاعل المستخدم. استخدم مستوى صوت منخفضاً
وتجنب الاستماع المطوّل بمستوى مرتفع.</small>
</section>
</main>

const $=id=>document.getElementById(id);
let ctx=null,master=null,nodes=[],timer=null,recorder=null,recordChunks=[];
let mediaDest=null,recording=false;

function tr(key){return (T[$("lang").value]||T.en)[key]||T.en[key]||key}
function setStatus(key){$("status").textContent=tr(key)}
function localize(){
 const lang=$("lang").value;
 document.documentElement.lang=lang==="light"?"en":lang;
 document.documentElement.dir=["ar","he","syr"].includes(lang)?"rtl":"ltr";
 ["title","intro","langLabel","modeLabel","carrierLabel","pulseLabel",
 "bpmLabel","depthLabel","volumeLabel","specLabel","start","stop",
 "export","record","notice"].forEach(id=>{
   const map={langLabel:"lang",modeLabel:"mode",carrierLabel:"carrier",
   pulseLabel:"pulse",bpmLabel:"bpm",depthLabel:"depth",
   volumeLabel:"volume",specLabel:"spec"};
   if(map[id]) $(id).firstChild.textContent=tr(map[id])+" ";
   else if(T[lang]&&T[lang][id]) $(id).textContent=tr(id);
 });
 const opts=$("mode").options;
 ["iso","psy","mil","hybrid"].forEach((k,i)=>opts[i].textContent=tr(k));
 updateNumbers();
 setStatus("ready");
}
function updateNumbers(){
 ["carrier","pulse","bpm","depth"].forEach(k=>{
 $(k+"V").textContent=$(k).value;
 });
}
["carrier","pulse","bpm","depth"].forEach(k=>{
 $(k).addEventListener("input",updateNumbers);
});
$("lang").addEventListener("change",localize);

function osc(freq,type="sine"){
 const o=ctx.createOscillator();
 o.type=type;o.frequency.value=freq;
 const g=ctx.createGain();g.gain.value=0;
 o.connect(g);g.connect(master);o.start();
 nodes.push(o,g);
 return {o,g};
}
function schedulePulse(g,rate,depth){
 if(timer)clearInterval(timer);
 const period=1000/rate;
 let phase=0;
 const d=depth/100;
 g.gain.setValueAtTime(.0001,ctx.currentTime);
 timer=setInterval(()=>{
   if(!ctx||ctx.state==="closed")return;
   const t=ctx.currentTime;
   const high=Math.max(.0001,d*.15);
   const low=Math.max(.0001,(1-d)*.15);
   g.gain.cancelScheduledValues(t);
   g.gain.setValueAtTime(high,t);
   g.gain.setValueAtTime(low,t+period/2000);
 },Math.max(12,period));
}
function drum(){
 const o=ctx.createOscillator(),g=ctx.createGain();
 o.type="sine";
 o.frequency.setValueAtTime(110,ctx.currentTime);
 o.frequency.exponentialRampToValueAtTime(42,ctx.currentTime+.14);
 g.gain.setValueAtTime(.22,ctx.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);
 o.connect(g);g.connect(master);
 o.start();o.stop(ctx.currentTime+.2);
}
async function startAudio(){
 stopAudio(false);
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){$("status").textContent="Web Audio API unavailable";return}
 ctx=new AC();await ctx.resume();
 master=ctx.createGain();
 master.gain.value=Number($("volume").value)/100;
 master.connect(ctx.destination);
 mediaDest=ctx.createMediaStreamDestination();
 master.connect(mediaDest);
 const mode=$("mode").value;
 const f=Number($("carrier").value);
 const rate=Number($("pulse").value);
 const depth=Number($("depth").value);
 const base=osc(f,"sawtooth");
 const filter=ctx.createBiquadFilter();
 filter.type="lowpass";filter.frequency.value=1800;
 base.g.connect(filter);
 // Move the carrier's output through a filter into the master bus.
 base.g.disconnect();filter.connect(master);
 base.g.gain.value=.12;
 const pulseGate=ctx.createGain();
 pulseGate.gain.value=.15;
 const carrier=ctx.createOscillator();
 carrier.type="sine";carrier.frequency.value=f;
 carrier.connect(pulseGate);pulseGate.connect(master);
 carrier.start();nodes.push(carrier,pulseGate);
 if(mode==="iso"||mode==="hybrid")schedulePulse(pulseGate,rate,depth);
 if(mode==="psy"||mode==="hybrid"){
   [1.005,1.5,2.01].forEach((ratio,i)=>{
     const x=osc(f*ratio,i===1?"triangle":"sine");
     x.g.gain.value=.025;
     const lfo=ctx.createOscillator();
     const lg=ctx.createGain();
     lfo.frequency.value=.05+i*.035;
     lg.gain.value=150+i*100;
     lfo.connect(lg);lg.connect(filter.frequency);
     lfo.start();nodes.push(lfo,lg);
   });
 }
 if(mode==="mil"||mode==="hybrid"){
   const beatMs=60000/Number($("bpm").value);
   let n=0;
   timer=setInterval(()=>{
     if(!ctx||ctx.state==="closed")return;
     if(n%4===0||n%4===2)drum();
     n++;
   },beatMs/2);
 }
 if(mode==="psy"){
   const lfo=ctx.createOscillator(),lg=ctx.createGain();
   lfo.frequency.value=.09;lg.gain.value=900;
   lfo.connect(lg);lg.connect(filter.frequency);lfo.start();
   nodes.push(lfo,lg);
 }
 if(mode==="iso")filter.frequency.value=3500;
 setStatus("on");
}
function stopAudio(update=true){
 if(timer){clearInterval(timer);timer=null}
 nodes.forEach(n=>{try{n.stop?.()}catch(e){}try{n.disconnect()}catch(e){}});
 nodes=[];
 if(ctx){const old=ctx;ctx=null;old.close().catch(()=>{});}
 master=null;mediaDest=null;
 if(update)setStatus("off");
}
$("start").addEventListener("click",startAudio);
$("stop").addEventListener("click",()=>stopAudio(true));
$("volume").addEventListener("input",()=>{
 if(master)master.gain.value=Number($("volume").value)/100;
});
function config(){
 return {
  product:"Global Qur'an-al-Mubeen-inspired Sonic Engine",
  version:"1.0.0-prototype",
  language:$("lang").value,
  mode:$("mode").value,
  carrierHz:Number($("carrier").value),
  pulseHz:Number($("pulse").value),
  tempoBpm:Number($("bpm").value),
  pulseDepthPercent:Number($("depth").value),
  volumePercent:Number($("volume").value),
  creativeSpecification:$("spec").value,
  note:"Audio synthesis is a creative process, not Qur'anic revelation or a guaranteed therapeutic effect."
 };
}
$("export").addEventListener("click",()=>{
 const blob=new Blob([JSON.stringify(config(),null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="global-sonic-spec.json";a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 setStatus("done");
});
$("record").addEventListener("click",async()=>{
 if(recording){
   recorder.stop();recording=false;
   $("record").textContent=tr("record");
   return;
 }
 if(!ctx||!mediaDest){
   $("status").textContent="Start audio before recording.";
   return;
 }
 if(!window.MediaRecorder){
   $("status").textContent="MediaRecorder unavailable in this browser.";
   return;
 }
 recordChunks=[];
 try{
   recorder=new MediaRecorder(mediaDest.stream);
   recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};
   recorder.onstop=()=>{
     const blob=new Blob(recordChunks,{type:recorder.mimeType||"audio/webm"});
     const a=document.createElement("a");
     a.href=URL.createObjectURL(blob);
     a.download="global-sonic-recording.webm";a.click();
     setTimeout(()=>URL.revokeObjectURL(a.href),1500);
     setStatus("done");
   };
   recorder.start();recording=true;
   $("record").textContent="■ Stop recording";
   setStatus("rec");
 }catch(e){$("status").textContent="Recording failed: "+e.message}
});
localize();
</script>
</body>
